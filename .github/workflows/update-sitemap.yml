name: sitemap অটো-আপডেট ও ডিপ্লয়

# কখন চলবে:
#  ১) প্রতি সোমবার সকালে (বাংলাদেশ সময় সকাল ৯টা ≈ UTC রাত ৩টা)
#  ২) GitHub-এ main ব্রাঞ্চে কোনো ফাইল কমিট করলেই
#  ৩) Actions ট্যাব থেকে ম্যানুয়ালি "Run workflow" চেপে
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write   # sitemap.xml ও product SEO pages কমিট করে ফেরত পুশ করার জন্য দরকার

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: রিপোজিটরি চেকআউট
        uses: actions/checkout@v4

      - name: Node.js সেটআপ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: sitemap.xml জেনারেট করা
        run: node scripts/generate-sitemap.js

      - name: পরিবর্তন থাকলে কমিট ও পুশ করা
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git add product/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "sitemap.xml-এ কোনো পরিবর্তন নেই, কমিট করার দরকার নেই।"
          else
            git commit -m "chore: sitemap.xml অটো-আপডেট"
            git push
          fi

      - name: Firebase Hosting-এ ডিপ্লয়
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: shovon-store
