name: sitemap অটো-আপডেট ও ডিপ্লয়

# কখন চলবে:
#  ১) প্রতি সোমবার সকালে (বাংলাদেশ সময় সকাল ৯টা ≈ UTC রাত ৩টা) — নিচের cron বদলে অন্য সময়ও দেওয়া যায়
#  ২) GitHub-এ main ব্রাঞ্চে কোনো ফাইল কমিট করলেই (কম্পিউটারে কিছু ইনস্টল ছাড়াই সাইট ডিপ্লয় হবে)
#  ৩) Actions ট্যাব থেকে ম্যানুয়ালি "Run workflow" চেপেও যেকোনো সময় চালানো যাবে
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch: {}

permissions:
  contents: write   # sitemap.xml কমিট করে ফেরত পুশ করার জন্য দরকার

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: রিপোজিটরি চেকআউট
        uses: actions/checkout@v4

      - name: Node.js সেটআপ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: sitemap.xml জেনারেট করা
        run: node scripts/generate-sitemap.js

      - name: পরিবর্তন থাকলে কমিট ও পুশ করা
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then
            echo "sitemap.xml-এ কোনো পরিবর্তন নেই, কমিট করার দরকার নেই।"
          else
            git commit -m "chore: sitemap.xml অটো-আপডেট"
            git push
          fi

      # নিচের স্টেপটা ঐচ্ছিক — sitemap আপডেটের সাথে সাথে পুরো সাইট Firebase Hosting-এ
      # ডিপ্লয়ও করে দিতে চাইলে রাখুন। এর জন্য FIREBASE_SERVICE_ACCOUNT সিক্রেট লাগবে
      # (নিচের নির্দেশনা দেখুন)। ডিপ্লয় না চাইলে এই স্টেপটা মুছে দিতে পারেন।
      - name: Firebase Hosting-এ ডিপ্লয়
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          channelId: live
          projectId: shovon-store
